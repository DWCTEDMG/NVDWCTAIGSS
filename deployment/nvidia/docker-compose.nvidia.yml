# Compose override for the NVIDIA-first EDMG Studio lane.
#
# Usage from the repository root:
#   docker compose -f docker-compose.starlift.yml -f deployment/nvidia/docker-compose.nvidia.yml up --build
#
# Optional NVIDIA service containers are intentionally profile-gated and
# image-configurable. Official NIM/Riva/NeMo images depend on NGC access,
# license acceptance, target GPU, and model family.

services:
  backend:
    environment:
      EDMG_NVIDIA_MODE: ${EDMG_NVIDIA_MODE:-1}
      EDMG_NVIDIA_PROFILE: ${EDMG_NVIDIA_PROFILE:-omniverse}
      EDMG_AI_PROVIDER: ${EDMG_AI_PROVIDER:-openai_compat}
      EDMG_AI_OPENAI_COMPAT_BASE_URL: ${EDMG_AI_OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:8001/v1}
      EDMG_AI_OPENAI_COMPAT_MODEL: ${EDMG_AI_OPENAI_COMPAT_MODEL:-nvidia-nim-model}
      EDMG_AI_OPENAI_COMPAT_API_KEY: ${EDMG_AI_OPENAI_COMPAT_API_KEY:-}
      NGC_API_KEY: ${NGC_API_KEY:-}
      EDMG_RIVA_URL: ${EDMG_RIVA_URL:-http://host.docker.internal:50051}
      EDMG_NVIDIA_NIM_URL: ${EDMG_NVIDIA_NIM_URL:-http://host.docker.internal:8001}
      EDMG_NVIDIA_OMNIVERSE_URL: ${EDMG_NVIDIA_OMNIVERSE_URL:-http://host.docker.internal:8011}
      EDMG_NVIDIA_NEMO_URL: ${EDMG_NVIDIA_NEMO_URL:-}
      EDMG_NVIDIA_TRITON_URL: ${EDMG_NVIDIA_TRITON_URL:-}
      EDMG_NVIDIA_TRITON_MODEL: ${EDMG_NVIDIA_TRITON_MODEL:-}
      EDMG_NVIDIA_AUDIO2FACE_URL: ${EDMG_NVIDIA_AUDIO2FACE_URL:-}
      EDMG_NVIDIA_AUDIO2FACE_GENERATE_PATH: ${EDMG_NVIDIA_AUDIO2FACE_GENERATE_PATH:-}
      EDMG_NVIDIA_ACE_URL: ${EDMG_NVIDIA_ACE_URL:-}
      EDMG_NVIDIA_ACE_GENERATE_PATH: ${EDMG_NVIDIA_ACE_GENERATE_PATH:-}
      EDMG_NVIDIA_COSMOS_URL: ${EDMG_NVIDIA_COSMOS_URL:-}
      EDMG_NVIDIA_COSMOS_MODEL: ${EDMG_NVIDIA_COSMOS_MODEL:-}
      EDMG_NVIDIA_COSMOS_INFER_PATH: ${EDMG_NVIDIA_COSMOS_INFER_PATH:-/v1/infer}
    volumes:
      - ./starlift-data/nvidia:/studio/nvidia

  nvidia-nim-llm:
    profiles: ["nvidia-local", "nim"]
    image: ${EDMG_NIM_LLM_IMAGE:-nvcr.io/nvidia/nim/set-edmg-nim-llm-image}
    restart: unless-stopped
    ports:
      - "${EDMG_NIM_LLM_PORT:-8001}:8000"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
      NIM_MAX_MODEL_LEN: ${EDMG_NIM_MAX_MODEL_LEN:-8192}
    volumes:
      - ./starlift-data/nvidia/nim-cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]

  nvidia-riva:
    profiles: ["nvidia-local", "riva"]
    image: ${EDMG_RIVA_IMAGE:-nvcr.io/nvidia/riva/set-edmg-riva-image}
    restart: unless-stopped
    ports:
      - "${EDMG_RIVA_GRPC_PORT:-50051}:50051"
      - "${EDMG_RIVA_HTTP_PORT:-9000}:9000"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
    volumes:
      - ./starlift-data/nvidia/riva-models:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]

  nvidia-nemo:
    profiles: ["nvidia-local", "nemo"]
    image: ${EDMG_NEMO_IMAGE:-nvcr.io/nvidia/nemo:26.04.00}
    restart: unless-stopped
    command: ["bash", "-lc", "sleep infinity"]
    working_dir: /workspace
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
    volumes:
      - ./starlift-data/nvidia/nemo:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]

  nvidia-triton:
    profiles: ["nvidia-local", "triton"]
    image: ${EDMG_TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:26.04-py3}
    restart: unless-stopped
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=poll
      - --repository-poll-secs=30
      - --strict-model-config=false
    ports:
      - "${EDMG_TRITON_HTTP_PORT:-8002}:8000"
      - "${EDMG_TRITON_GRPC_PORT:-8003}:8001"
      - "${EDMG_TRITON_METRICS_PORT:-8004}:8002"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
    volumes:
      - ${EDMG_TRITON_MODEL_REPOSITORY:-./deployment/nvidia/triton-model-repository}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]

  nvidia-audio2face:
    profiles: ["nvidia-local", "audio2face", "ace"]
    image: ${EDMG_AUDIO2FACE_IMAGE:-nvcr.io/nvidia/omniverse/set-edmg-audio2face-image}
    restart: unless-stopped
    ports:
      - "${EDMG_AUDIO2FACE_HTTP_PORT:-8011}:8011"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
    volumes:
      - ./starlift-data/nvidia/audio2face:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]

  nvidia-cosmos:
    profiles: ["nvidia-local", "cosmos"]
    image: ${EDMG_COSMOS_IMAGE:-nvcr.io/nvidia/cosmos/set-edmg-cosmos-image}
    restart: unless-stopped
    ports:
      - "${EDMG_COSMOS_HTTP_PORT:-8012}:8000"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
    volumes:
      - ./starlift-data/nvidia/cosmos:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EDMG_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]
