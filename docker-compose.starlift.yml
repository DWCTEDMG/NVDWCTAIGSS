services:
  backend:
    build:
      context: ./studio/edmg-studio/python_backend
      dockerfile: Dockerfile
    container_name: edmg-studio-backend
    restart: unless-stopped
    expose:
      - "7863"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EDMG_STUDIO_BACKEND_HOST: 0.0.0.0
      EDMG_STUDIO_BACKEND_PORT: 7863
      EDMG_AI_MODE: ${EDMG_AI_MODE:-local}
      EDMG_AI_PROVIDER: ${EDMG_AI_PROVIDER:-openai_compat}
      EDMG_NVIDIA_MODE: ${EDMG_NVIDIA_MODE:-1}
      EDMG_NVIDIA_PROFILE: ${EDMG_NVIDIA_PROFILE:-omniverse}
      EDMG_NVIDIA_NIM_URL: ${EDMG_NVIDIA_NIM_URL:-http://host.docker.internal:8001}
      EDMG_AI_OPENAI_COMPAT_BASE_URL: ${EDMG_AI_OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:8001/v1}
      EDMG_AI_OPENAI_COMPAT_MODEL: ${EDMG_AI_OPENAI_COMPAT_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
      EDMG_NVIDIA_RIVA_URL: ${EDMG_NVIDIA_RIVA_URL:-host.docker.internal:50051}
      EDMG_NVIDIA_RIVA_ASR: ${EDMG_NVIDIA_RIVA_ASR:-1}
      EDMG_NVIDIA_RIVA_ASR_FALLBACK: ${EDMG_NVIDIA_RIVA_ASR_FALLBACK:-0}
      EDMG_COMFYUI_URL: ${EDMG_COMFYUI_URL:-http://host.docker.internal:8188}
      EDMG_FFMPEG_PATH: ffmpeg
    volumes:
      - ./starlift-data/data:/studio/data
      - ./starlift-data/models:/studio/models
      - ./starlift-data/cache:/studio/cache
      - ./starlift-data/logs:/studio/logs
      - ./starlift-data/external:/studio/external
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7863/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  web:
    build:
      context: ./studio/edmg-studio
      dockerfile: Dockerfile.starlift
    container_name: edmg-studio-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${EDMG_PORT:-8080}:8080"
