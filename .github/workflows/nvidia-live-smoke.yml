name: NVIDIA Live GPU Smoke

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Studio project id with a saved NVIDIA scene plan"
        required: true
        default: "4af898d1ebb24a0d8ed2d59a337dd965"
      kit_sdk_root:
        description: "Absolute path to an installed Kit SDK root on the self-hosted runner"
        required: true
        default: "D:\\NVIDIA\\Omniverse\\kit-sdk-110.1.1"
      ffmpeg_path:
        description: "Absolute path to ffmpeg.exe on the self-hosted runner"
        required: false
        default: "C:\\Users\\lanak\\AppData\\Local\\Microsoft\\WinGet\\Links\\ffmpeg.exe"
      ffprobe_path:
        description: "Absolute path to ffprobe.exe on the self-hosted runner"
        required: false
        default: "C:\\Users\\lanak\\AppData\\Local\\Microsoft\\WinGet\\Links\\ffprobe.exe"
      backend_url:
        description: "Local backend URL"
        required: false
        default: "http://127.0.0.1:8000"

jobs:
  live-kit-rtx-smoke:
    runs-on: [self-hosted, Windows, X64, nvidia]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live NVIDIA Kit smoke
        shell: pwsh
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          EDMG_AI_OPENAI_COMPAT_API_KEY: ${{ secrets.EDMG_AI_OPENAI_COMPAT_API_KEY }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File deployment\nvidia\run_live_gpu_smoke.ps1 `
            -BackendUrl "${{ inputs.backend_url }}" `
            -KitSdkRoot "${{ inputs.kit_sdk_root }}" `
            -ProjectId "${{ inputs.project_id }}" `
            -FfmpegPath "${{ inputs.ffmpeg_path }}" `
            -FfprobePath "${{ inputs.ffprobe_path }}"
